name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -m "not slow" -q

  # Token-exact comparison against Hugging Face on CPU (downloads the 1B model, ~2.5 GB).
  correctness:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-llama-3.2-1b-instruct
      - run: uv sync --frozen
      # One process per test module: each loads 1-3 copies of the 1B model in fp32, and
      # memory freed by one module is not reliably returned to the OS before the next
      # (the runner has 16 GB). Exit code 5 means the module has no slow tests.
      - run: |
          for f in tests/test_*.py; do
            uv run pytest -m slow -q "$f" || [ $? -eq 5 ] || exit 1
          done

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
